<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chojema Image+</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="mode-browser">
    <div id="browser">
      <aside id="sidebar">
        <div class="side-scroll">
          <div id="side-library" class="folder-lists"></div>
          <section id="tree-section">
            <h3 id="tree-title"></h3>
            <div id="tree" role="tree"></div>
          </section>
        </div>
        <div class="side-foot">
          <button id="settings-button" type="button">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" /></svg>
            <span id="settings-label"></span>
          </button>
        </div>
      </aside>
      <div id="splitter" role="separator"></div>
      <section id="gallery">
        <header id="gallery-bar">
          <button data-browse="up" type="button"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" /></svg></button>
          <div id="crumbs"></div>
          <span id="gallery-count"></span>
          <select id="sort"></select>
          <button id="sort-dir" data-browse="sort-dir" type="button"><svg viewBox="0 0 24 24"><path d="M8 5v14M4 15l4 4 4-4M16 19V5M12 9l4-4 4 4" /></svg></button>
          <input id="thumb-size" type="range" min="96" max="320" step="8" />
          <button id="compare-button" data-browse="compare" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="8" height="14" rx="1.5" /><rect x="13" y="5" width="8" height="14" rx="1.5" /></svg></button>
          <button id="browse-favorite" data-browse="favorite" type="button"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z" /></svg></button>
          <button data-browse="refresh" type="button"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" /></svg></button>
          <button data-browse="open" type="button"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg></button>
        </header>
        <div id="grid" tabindex="0"></div>
        <section id="gallery-empty">
          <p id="gallery-empty-text"></p>
          <div class="empty-actions">
            <button id="empty-open-file" type="button"></button>
            <button id="empty-open-folder" type="button"></button>
          </div>
        </section>
      </section>
    </div>

    <div id="viewer">
      <main id="stage">
        <img id="image" class="view-img" alt="" draggable="false" />
        <p id="message" hidden></p>
      </main>
      <footer id="bar">
        <div class="info">
          <button data-action="back" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1" /><rect x="13" y="4" width="7" height="7" rx="1" /><rect x="4" y="13" width="7" height="7" rx="1" /><rect x="13" y="13" width="7" height="7" rx="1" /></svg></button>
          <span id="info-name"></span>
          <span id="info-detail"></span>
        </div>
        <div class="tools">
          <button data-action="prev" type="button"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg></button>
          <button data-action="next" type="button"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg></button>
          <span class="sep"></span>
          <button data-action="zoom-out" type="button"><svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg></button>
          <button id="zoom-label" data-action="toggle-zoom" type="button" class="label"></button>
          <button data-action="zoom-in" type="button"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12" /></svg></button>
          <button data-action="fit" type="button"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg></button>
          <span class="sep"></span>
          <button data-action="rotate-left" type="button"><svg viewBox="0 0 24 24"><path d="M4 4v6h6" /><path d="M5.5 15a7 7 0 1 0 1.2-7.4L4 10" /></svg></button>
          <button data-action="rotate-right" type="button"><svg viewBox="0 0 24 24"><path d="M20 4v6h-6" /><path d="M18.5 15a7 7 0 1 1-1.2-7.4L20 10" /></svg></button>
          <span class="sep"></span>
          <button data-action="fullscreen" type="button"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /><rect x="9" y="9" width="6" height="6" /></svg></button>
          <button id="favorite-button" data-action="favorite" type="button"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.9l-5.25 2.7 1-5.8L3.5 9.7l5.9-.9z" /></svg></button>
          <button id="folders-button" data-action="folders" type="button"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z" /></svg></button>
        </div>
      </footer>
    </div>

    <div id="compare">
      <div id="panes"></div>
      <footer id="compare-bar">
        <div class="info">
          <button data-cmp="back" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1" /><rect x="13" y="4" width="7" height="7" rx="1" /><rect x="4" y="13" width="7" height="7" rx="1" /><rect x="13" y="13" width="7" height="7" rx="1" /></svg></button>
          <span id="compare-title"></span>
        </div>
        <div class="tools">
          <button data-cmp="layout" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5" /><path d="M12 5v14" /></svg></button>
          <button data-cmp="sync" type="button"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1" /><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" /></svg></button>
          <span class="sep"></span>
          <button data-cmp="zoom-out" type="button"><svg viewBox="0 0 24 24"><path d="M6 12h12" /></svg></button>
          <button id="compare-zoom" data-cmp="actual" type="button" class="label"></button>
          <button data-cmp="zoom-in" type="button"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12" /></svg></button>
          <button data-cmp="fit" type="button"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg></button>
          <span class="sep"></span>
          <button data-cmp="rotate-left" type="button"><svg viewBox="0 0 24 24"><path d="M4 4v6h6" /><path d="M5.5 15a7 7 0 1 0 1.2-7.4L4 10" /></svg></button>
          <button data-cmp="rotate-right" type="button"><svg viewBox="0 0 24 24"><path d="M20 4v6h-6" /><path d="M18.5 15a7 7 0 1 1-1.2-7.4L20 10" /></svg></button>
          <button data-cmp="close-pane" type="button"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
          <span class="sep"></span>
          <button data-cmp="fullscreen" type="button"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /><rect x="9" y="9" width="6" height="6" /></svg></button>
        </div>
      </footer>
    </div>

    <aside id="panel" class="folder-lists" hidden></aside>

    <div id="settings" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h2 id="settings-title"></h2>
        <fieldset>
          <legend id="startup-legend"></legend>
          <label><input type="radio" name="startup" value="last" /> <span id="startup-last"></span></label>
          <label><input type="radio" name="startup" value="empty" /> <span id="startup-empty"></span></label>
        </fieldset>
        <fieldset>
          <legend id="cache-legend"></legend>
          <button id="clear-cache" type="button"></button>
        </fieldset>
        <div class="dialog-actions">
          <button id="settings-close" type="button"></button>
        </div>
      </div>
    </div>

    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
